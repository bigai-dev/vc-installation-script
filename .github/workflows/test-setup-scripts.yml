name: Test setup scripts

# Runs the REAL setup scripts on GitHub's free cloud computers - real Windows
# and real Macs - so the scripts can be tested without owning a Windows device.
# Runs when a pull request changes the scripts, when changes land on main,
# when someone clicks "Run workflow" (Actions tab), and every Monday so outside
# changes (a new Python or Node release, a renamed package) are caught early.
on:
  pull_request:
    paths:
      - 'script/**'
      - '.github/workflows/test-setup-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'script/**'
      - '.github/workflows/test-setup-scripts.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'   # Mondays 01:00 UTC = 09:00 Malaysia

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.os }}, ${{ matrix.start }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # windows-2025:   Windows on an Intel/AMD chip (like most student laptops)
        # windows-2022:   built on the same core as Windows 10 (GitHub has no
        #                 Windows 10 machines; this is the closest it offers)
        # windows-11-arm: Windows 11 on an ARM chip (like Snapdragon laptops)
        os: [windows-2025, windows-2022, windows-11-arm]
        # no-node:  a laptop without Node.js - the fixer installs it
        # old-node: like the student PC that failed in Nov 2026 - an old
        #           Node.js and an old Claude Code from npm already there
        start: [no-node]
        include:
          - os: windows-2025
            start: old-node
    steps:
      - uses: actions/checkout@v7

      - name: Script has no syntax errors (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\script\fix-vibecode.ps1", [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error file=script/fix-vibecode.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            exit 1
          }
          Write-Host "No syntax errors."

      - name: Make this cloud machine look like a student laptop
        shell: powershell
        run: |
          # The cloud machine has an extra Python on its system PATH that a
          # student laptop wouldn't have. Hide it so the fixer has to install
          # Python 3.14 itself, like it would for a student.
          foreach ($scope in 'Machine', 'User') {
            $old = [Environment]::GetEnvironmentVariable('Path', $scope)
            if (-not $old) { continue }
            $new = ($old -split ';' | Where-Object { $_ -and $_ -notmatch '\\hostedtoolcache\\windows\\Python\\' }) -join ';'
            [Environment]::SetEnvironmentVariable('Path', $new, $scope)
          }
          Write-Host "Pre-installed Python hidden from PATH."
          # Some cloud machines (Windows Server 2022) also have the very same
          # Python 3.14 pre-installed. Python's installer then quietly reuses
          # that hidden copy instead of installing fresh, which a student
          # laptop wouldn't do - so uninstall it first. Its parts are
          # registered machine-wide as separate MSI packages ("Python 3.14.x
          # Core Interpreter (64-bit)" and so on); the bundle entry that would
          # uninstall them all at once belongs to the user who built the image.
          $uninstallKeys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                           'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          $parts = @(Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match '^Python 3\.14\.\d+ ' -and $_.PSChildName -match '^\{[0-9A-Fa-f-]{36}\}$' })
          foreach ($p in $parts) {
            Write-Host "Removing pre-installed $($p.DisplayName)..."
            try {
              $proc = Start-Process msiexec.exe -ArgumentList "/x $($p.PSChildName) /qn /norestart" -Wait -PassThru
              Write-Host "  finished (exit code $($proc.ExitCode))"
            } catch {
              Write-Host "::warning::Could not remove $($p.DisplayName): $($_.Exception.Message)"
            }
          }
          if (-not $parts) { Write-Host "No pre-installed Python 3.14 to remove." }
          $left = Get-ItemProperty 'HKLM:\SOFTWARE\Python\PythonCore\3.14*\InstallPath' -ErrorAction SilentlyContinue
          if ($left) { Write-Host "::warning::Python 3.14 is still registered at $($left.'(default)')" }

          # Cloud machines also come with Node.js already installed, and with
          # npm set up to put tools in C:\npm\prefix. A student laptop has no
          # Node.js (or an old one), and npm puts tools in %APPDATA%\npm.
          # Remove all of that so the fixer has to install Node itself.
          Write-Host "This step was started with npm_config_prefix='$env:npm_config_prefix'"
          Remove-Item Env:npm_config_prefix, Env:npm_config_cache -ErrorAction SilentlyContinue
          $nodeParts = @(Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match '^Node\.js' -and $_.PSChildName -match '^\{[0-9A-Fa-f-]{36}\}$' })
          foreach ($p in $nodeParts) {
            Write-Host "Removing pre-installed $($p.DisplayName) $($p.DisplayVersion)..."
            $proc = Start-Process msiexec.exe -ArgumentList "/x $($p.PSChildName) /qn /norestart" -Wait -PassThru
            Write-Host "  finished (exit code $($proc.ExitCode))"
          }
          Remove-Item "$env:ProgramFiles\nodejs", 'C:\npm', "$env:APPDATA\npm", "$env:APPDATA\npm-cache", "$env:LOCALAPPDATA\npm-cache", "$env:USERPROFILE\.npmrc" -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($scope in 'Machine', 'User') {
            foreach ($name in 'npm_config_prefix', 'npm_config_cache') {
              if ([Environment]::GetEnvironmentVariable($name, $scope)) {
                Write-Host "Removing the cloud machine's $name setting ($scope)"
                [Environment]::SetEnvironmentVariable($name, $null, $scope)
              }
            }
            $old = [Environment]::GetEnvironmentVariable('Path', $scope)
            if (-not $old) { continue }
            $new = ($old -split ';' | Where-Object { $_ -and $_ -notmatch '^C:\\npm\\' -and $_ -notmatch '\\nodejs\\?$' -and $_ -notmatch '\\AppData\\Roaming\\npm\\?$' }) -join ';'
            [Environment]::SetEnvironmentVariable('Path', $new, $scope)
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $left = @(Get-Command node -All -ErrorAction SilentlyContinue | ForEach-Object Source)
          if ($left) { Write-Host "::warning::node is still on PATH: $($left -join ', ')" } else { Write-Host "Pre-installed Node.js removed." }

          if ('${{ matrix.start }}' -eq 'old-node') {
            # Node.js 20 from nodejs.org (what the Node MSI installer sets up:
            # node in Program Files, npm tools in %APPDATA%\npm on the user's
            # PATH) and Claude Code installed with npm months ago.
            $ErrorActionPreference = 'Continue'
            $v20 = (Invoke-RestMethod https://nodejs.org/dist/index.json | Where-Object { $_.version -like 'v20.*' } | Select-Object -First 1).version
            $msi = Join-Path $env:RUNNER_TEMP "node-$v20-x64.msi"
            Invoke-WebRequest "https://nodejs.org/dist/$v20/node-$v20-x64.msi" -OutFile $msi -UseBasicParsing
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
            Write-Host "Installed Node.js $v20 (exit code $($proc.ExitCode))"
            $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
            & "$env:ProgramFiles\nodejs\npm.cmd" install -g '@anthropic-ai/claude-code@2.1.181'
            Write-Host "npm puts tools in: $(& "$env:ProgramFiles\nodejs\npm.cmd" prefix -g)"
            Write-Host "User PATH: $([Environment]::GetEnvironmentVariable('Path', 'User'))"
          }

      - name: Check-only run (-DiagnoseOnly)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File script\fix-vibecode.ps1 -DiagnoseOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full run through run-fixer.bat (the file students double-click)
        shell: cmd
        timeout-minutes: 45
        # "< nul" answers the two "press any key" pauses automatically. The
        # cloud machine's own npm settings, which this step still inherits,
        # are cleared first: a student's PC doesn't have them.
        run: |
          set npm_config_prefix=
          set npm_config_cache=
          call script\run-fixer.bat < nul

      - name: Every tool is OK in the final table
        shell: powershell
        run: |
          $log = Get-ChildItem "$env:TEMP\fix-vibecode-2*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log) { Write-Host "::error::No session log found - the fixer did not run"; exit 1 }
          $lines = @(Get-Content $log.FullName)
          $hit = $lines | Select-String -Pattern 'Tool\s+Status\s+Version' | Select-Object -Last 1
          if ($hit) { $lines[($hit.LineNumber - 1)..($lines.Count - 1)] | ForEach-Object { Write-Host $_ } }
          # A failed row can end right after "Failed" (no version or path), and
          # "Next steps once all tools are working" must not count as success,
          # so match the table status and the exact success sentence.
          $failed = @($lines | Select-String -CaseSensitive -Pattern '^\s{2}\S+\s+Failed(\s|$)')
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
            exit 1
          }
          if (-not ($lines | Select-String -CaseSensitive -SimpleMatch 'All tools are working in THIS PowerShell window')) {
            Write-Host "::error::The fixer did not finish with 'All tools are working'"
            exit 1
          }

      - name: Tools work in a brand-new window
        shell: powershell
        run: |
          # Same as a student closing the fixer and opening a fresh PowerShell.
          # GitHub runs these steps with ErrorActionPreference=Stop, which turns
          # anything a tool prints on stderr (Vercel prints "Vercel CLI 65.x"
          # there) into a crash. A normal PowerShell window uses Continue.
          $ErrorActionPreference = 'Continue'
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $bad = 0
          foreach ($t in 'python', 'node', 'npm.cmd', 'git', 'gh', 'supabase', 'vercel', 'claude') {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) {
              $out = 'NOT FOUND'
            } else {
              $out = try { "$(& $t --version 2>&1 | Select-Object -First 1)" } catch { "ERROR: $($_.Exception.Message)" }
            }
            Write-Host ('{0,-10} {1}' -f $t, $out)
            if ($out -notmatch '\d+\.\d+') { Write-Host "::error::$t does not work in a new window"; $bad++ }
          }
          $py = "$(& python --version 2>&1)" -replace '^Python\s+', ''
          if ($py -notmatch '^\d+\.\d+' -or [version]($py -replace '[^\d.].*$', '') -lt [version]'3.14') {
            Write-Host "::error::python in a new window is '$py', expected 3.14 or newer"
            $bad++
          }
          if ($bad) { exit 1 }

      - name: Tools work for Claude Code (it runs commands through Git Bash)
        shell: powershell
        timeout-minutes: 5
        run: |
          # On Windows, Claude Code runs every command through Git Bash, not
          # PowerShell. Start from a brand-new window's PATH, find Git Bash the
          # way Claude Code does (next to git), and run each tool through it.
          $ErrorActionPreference = 'Continue'
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $git = Get-Command git -ErrorAction SilentlyContinue
          if (-not $git) { Write-Host "::error::git is not on PATH, so Claude Code cannot find Git Bash"; exit 1 }
          $bash = Join-Path (Split-Path (Split-Path $git.Source -Parent) -Parent) 'bin\bash.exe'
          if (-not (Test-Path $bash)) { Write-Host "::error::Git Bash not found at $bash (next to $($git.Source))"; exit 1 }
          Write-Host "Claude Code would use Git Bash at: $bash"
          $check = Join-Path $env:RUNNER_TEMP 'claude-code-tools.sh'
          $lines = @(
            'for t in python node npm git gh supabase vercel claude; do',
            '  printf "%-9s %s   [%s]\n" "$t" "$("$t" --version 2>&1 | head -n 1)" "$(command -v "$t")"',
            'done'
          )
          [IO.File]::WriteAllText($check, ($lines -join "`n") + "`n")
          $out = @(& $bash -l ($check -replace '\\', '/') 2>&1 | ForEach-Object { "$_" })
          $out | ForEach-Object { Write-Host $_ }
          # Judge only what each tool printed, not the [folder] it was found in.
          $bad = 0
          $versions = @{}
          foreach ($t in 'python', 'node', 'npm', 'git', 'gh', 'supabase', 'vercel', 'claude') {
            $line = "$($out | Where-Object { $_ -match "^$t\s" } | Select-Object -First 1)"
            $versions[$t] = ($line -replace '^\S+\s+', '') -replace '\s+\[[^\]]*\]\s*$', ''
            if ($versions[$t] -notmatch '\d+\.\d+') { Write-Host "::error::$t does not work in Git Bash, so Claude Code can't use it"; $bad++ }
          }
          $py = ($versions['python'] -replace '^Python\s+', '') -replace '\s.*$', ''
          if ($py -notmatch '^\d+\.\d+' -or [version]($py -replace '[^\d.].*$', '') -lt [version]'3.14') {
            Write-Host "::error::python in Git Bash is '$py', expected 3.14 or newer"
            $bad++
          }
          exit $bad

      - name: Supabase login stays out of the Windows password vault
        shell: powershell
        timeout-minutes: 5
        run: |
          # Avast/AVG removed Windows files (Version.dll) on student PCs around
          # "supabase login". Supabase CLI v3 saves the login in the Windows
          # password vault through a helper it unpacks into TEMP, which looks
          # like password theft. The fixer turns on Supabase's own switch
          # (SUPABASE_NO_KEYRING=1) so the login goes to a file instead.
          # Logs in twice with a made-up token in Supabase's format (not a real
          # login): with the fixer's setting, then without it for comparison.
          $ErrorActionPreference = 'Continue'
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $setting = [Environment]::GetEnvironmentVariable('SUPABASE_NO_KEYRING', 'User')
          Write-Host "A new window gets SUPABASE_NO_KEYRING='$setting'"
          $token = 'sbp_' + ('0123456789abcdef' * 3).Substring(0, 40)
          $tokenFile = Join-Path $env:USERPROFILE '.supabase\access-token'

          function Test-SupabaseLogin([string]$label) {
            Remove-Item $tokenFile -Force -ErrorAction SilentlyContinue
            $helpersBefore = @(Get-ChildItem $env:TEMP -Recurse -Force -Filter *.node -ErrorAction SilentlyContinue | ForEach-Object FullName)
            $vaultBefore = @(cmdkey /list | Select-String -Pattern 'supabase' | ForEach-Object { $_.Line.Trim() })
            $out = @(& supabase login --token $token 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $helpers = @(Get-ChildItem $env:TEMP -Recurse -Force -Filter *.node -ErrorAction SilentlyContinue | ForEach-Object FullName | Where-Object { $helpersBefore -notcontains $_ })
            $vault = @(cmdkey /list | Select-String -Pattern 'supabase' | ForEach-Object { $_.Line.Trim() } | Where-Object { $vaultBefore -notcontains $_ })
            $file = (Test-Path $tokenFile) -and ("$(Get-Content $tokenFile -Raw)".Trim() -eq $token)
            Write-Host ""
            Write-Host "== $label"
            $out | ForEach-Object { Write-Host "   supabase says: $_" }
            Write-Host "   exit code:                 $code"
            Write-Host "   helper unpacked into TEMP: $(if ($helpers.Count) { $helpers -join ', ' } else { 'no' })"
            Write-Host "   new password-vault entry:  $(if ($vault.Count) { $vault -join ', ' } else { 'no' })"
            Write-Host "   login saved in a file:     $(if ($file) { $tokenFile } else { 'no' })"
            [pscustomobject]@{ Code = $code; Helpers = $helpers.Count; Vault = $vault.Count; File = $file }
          }

          $env:SUPABASE_NO_KEYRING = $setting
          $with = Test-SupabaseLogin 'WITH the fixer setting (what students get now)'
          Remove-Item Env:SUPABASE_NO_KEYRING -ErrorAction SilentlyContinue
          $without = Test-SupabaseLogin 'WITHOUT the setting (Supabase default, for comparison)'

          $bad = 0
          if ($setting -ne '1') { Write-Host "::error::The fixer did not turn on SUPABASE_NO_KEYRING for new windows"; $bad++ }
          if ($with.Code -ne 0) { Write-Host "::error::supabase login failed with the setting on"; $bad++ }
          if (-not $with.File) { Write-Host "::error::With the setting on, the login was not saved in $tokenFile"; $bad++ }
          if ($with.Vault) { Write-Host "::error::With the setting on, Supabase still wrote to the Windows password vault"; $bad++ }
          if ($with.Helpers) { Write-Host "::error::With the setting on, Supabase still unpacked its password-vault helper"; $bad++ }
          if (-not $without.Vault -and -not $without.Helpers) {
            Write-Host "::warning::Even without the setting, no vault entry or helper showed up here, so this machine cannot show the difference"
          }
          exit $bad

      - name: Collect logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:TEMP\fix-vibecode*.log" logs\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.os }}-${{ matrix.start }}
          path: logs/
          if-no-files-found: ignore

  mac:
    name: Mac (${{ matrix.os }}, ${{ matrix.route }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple-chip Macs on current macOS: the Homebrew route.
          - os: macos-15
            route: Homebrew
          - os: macos-26
            route: Homebrew
          # Older Macs: each tool's official download instead of Homebrew.
          # Their pre-installed tools are removed first, so every download,
          # fingerprint check and install step really runs.
          # GitHub no longer offers macOS 14 machines, so the Apple-chip
          # direct route is forced with --no-homebrew on macOS 15 instead.
          - os: macos-15
            route: direct downloads
            fresh: true
            flags: --no-homebrew
          - os: macos-15-intel    # Intel Mac: picks the direct route by itself
            route: direct downloads
            fresh: true
    env:
      FRESH: ${{ matrix.fresh }}
      FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7

      - name: Scripts have no syntax errors (the Mac's built-in bash 3.2)
        run: |
          /bin/bash -n script/fix-vibecode-mac.sh
          /bin/bash -n script/run-fixer.command
          echo "No syntax errors."

      - name: Remove the cloud Mac's pre-installed tools (older-Mac jobs)
        if: matrix.fresh
        run: |
          # A student's older Mac usually has none of these, so take them away
          # and make the fixer download each one itself.
          brew list --formula | grep -E '^(node|node@[0-9]+|python@3\.[0-9]+|gh|supabase)$' \
            | xargs -n 1 brew uninstall --ignore-dependencies --force 2>/dev/null || true
          # Hide any python.org Python too (moved aside, not deleted).
          if [ -d /Library/Frameworks/Python.framework ]; then
            sudo mv /Library/Frameworks/Python.framework /Library/Frameworks/Python.framework.hidden
          fi
          echo "Left on the default PATH:"
          for t in python3 node npm gh supabase vercel claude; do
            printf '  %-9s %s\n' "$t" "$(PATH=/usr/local/bin:/usr/bin:/bin command -v "$t" || echo '-')"
          done

      - name: Check-only run (--diagnose-only)
        run: |
          if [ "$FRESH" = "true" ]; then
            # Clean environment, like a brand-new Terminal on a student's Mac.
            env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL="$SHELL" TERM=dumb \
              PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin /bin/bash script/fix-vibecode-mac.sh $FLAGS --diagnose-only
          else
            /bin/bash script/fix-vibecode-mac.sh $FLAGS --diagnose-only
          fi

      - name: Full run
        timeout-minutes: 45
        run: |
          if [ "$FRESH" = "true" ]; then
            env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL="$SHELL" TERM=dumb \
              PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin /bin/bash script/fix-vibecode-mac.sh $FLAGS
          else
            /bin/bash script/fix-vibecode-mac.sh $FLAGS
          fi

      - name: Every tool is OK in the final table
        run: |
          log=$(ls -t /tmp/fix-vibecode-*.log 2>/dev/null | head -n 1)
          [ -n "$log" ] || { echo "::error::No session log found - the fixer did not run"; exit 1; }
          sed -n '/Tool        Status/,$p' "$log"
          if grep -E '^  [a-z0-9]+ +Failed ' "$log"; then
            echo "::error::Some tools failed - see the table above"
            exit 1
          fi
          grep -q 'All tools are working' "$log" || { echo "::error::The fixer did not finish with 'All tools are working'"; exit 1; }

      - name: Every tool works in a brand-new Terminal window
        run: |
          # A clean login shell, like a student opening a new Terminal window.
          sh_bin="${SHELL:-/bin/zsh}"
          env -i HOME="$HOME" USER="$USER" LOGNAME="$USER" SHELL="$sh_bin" TERM=xterm-256color \
            "$sh_bin" -l -i -c 'for t in python3 node npm git gh supabase vercel claude; do printf "%-9s %s\n" "$t" "$($t --version 2>&1 | head -n 1)"; done' 2>/dev/null | tee fresh.txt
          bad=0
          for t in node npm git gh supabase vercel claude; do
            grep -Eq "^$t +.*[0-9]+\.[0-9]+" fresh.txt || { echo "::error::$t does not work in a new window"; bad=1; }
          done
          py=$(awk '$1=="python3" {print $3}' fresh.txt)
          printf '%s\n%s\n' "3.14.0" "$py" | sort -t. -k1,1n -k2,2n -k3,3n -C || { echo "::error::python3 in a new window is '$py', expected 3.14 or newer"; bad=1; }
          exit $bad

      - name: Collect logs
        if: always()
        run: mkdir -p logs && cp /tmp/fix-vibecode-*.log logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: logs/
          if-no-files-found: ignore
